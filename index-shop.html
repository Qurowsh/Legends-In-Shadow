<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | NICHERZ</title>
    <link rel="stylesheet" href="style-shop.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/jpeg" href="./Images/logo.jpg" />
  </head>

  <body>
    <script src="products.js"></script>

    <div class="smoke-background" aria-hidden="true">
      <div class="smoke smoke-one"></div>
      <div class="smoke smoke-two"></div>
      <div class="smoke smoke-three"></div>
    </div>

    <header class="shop-header">
      <div class="shop-header-inner">
        <a class="brand-wrap" href="index-shop.html" aria-label="NICHERZ Shop">
          <div class="brand-mark">
            <img
              src="./Images/logo.jpg"
              alt="NICHERZ logo"
              width="44"
              height="44"
            />
          </div>
          <div class="brand-copy">
            <span class="brand-name">NICHERZ</span>
            <small>ARCHIVE</small>
          </div>
        </a>

        <nav class="header-nav" aria-label="Main navigation">
          <a href="index.html">HOME</a>
          <a href="index-shop.html" class="active-nav" aria-current="page">SHOP</a>
          <a href="index.html#gallery">BANDS</a>
          <a href="contact.html">CONTACT</a>
        </nav>

        <div class="header-actions">
          <button class="cart-pill" type="button" aria-label="Open cart">CART (0)</button>
        </div>
      </div>
    </header>

    <main class="shop-page">
      <section class="shop-hero">
        <h1 class="shop-title">THE ARCHIVE</h1>
        <p class="shop-subtitle">Wear The Legend</p>
      </section>

      <section class="products-section">
        <nav class="shop-categories" aria-label="Product categories">
          <button type="button" class="category-btn active" data-category="all" aria-pressed="true">ALL</button>
          <button type="button" class="category-btn" data-category="band-merch" aria-pressed="false">BAND MERCH</button>
          <button type="button" class="category-btn" data-category="y2k" aria-pressed="false">Y2K</button>
          <button type="button" class="category-btn" data-category="streetwear" aria-pressed="false">STREETWEAR</button>
          <button type="button" class="category-btn" data-category="accessories" aria-pressed="false">ACCESSORIES</button>
          <button type="button" class="category-btn" data-category="music" aria-pressed="false">MUSIC</button>
          <button type="button" class="category-btn" data-category="collectibles" aria-pressed="false">COLLECTIBLES</button>
        </nav>

        <div class="products-container" id="products-container"></div>
      </section>
    </main>

    <footer class="shop-footer">
      <div class="footer-grid">
        <div class="footer-brand">
          <span class="footer-logo">N</span>
          <div>
            <h3>NICHERZ</h3>
            <p>Curated chaos for the loudest souls.</p>
          </div>
        </div>

        <div class="footer-links">
          <h4>SHOP</h4>
          <a href="index-shop.html?category=band-merch">Band Merch</a>
          <a href="index-shop.html?category=streetwear">Streetwear</a>
          <a href="index-shop.html?category=accessories">Accessories</a>
        </div>

        <div class="footer-links">
          <h4>INFO</h4>
          <a href="contact.html">About</a>
          <a href="#">Shipping</a>
          <a href="#">Support</a>
        </div>

        <div class="footer-links">
          <h4>FOLLOW</h4>
          <a href="https://instagram.com/nicherzz" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="https://t.me/nicherz" target="_blank" rel="noopener noreferrer">Telegram</a>
        </div>
      </div>

      <div class="footer-bottom">
        <span>© 2026 NICHERZ</span>
        <span>WEAR THE LEGEND</span>
      </div>
    </footer>

    <script src="shop.js"></script>
  </body>
</html>
