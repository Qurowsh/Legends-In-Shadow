<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | NICHERZ</title>
    <link rel="stylesheet" href="style-shop.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/jpeg" href="./Images/logo.jpg" />
  </head>

  <body>
    <div class="smoke-background">
      <div class="smoke smoke-one"></div>
      <div class="smoke smoke-two"></div>
      <div class="smoke smoke-three"></div>
    </div>

    <header class="shop-header">
      <div class="shop-header-inner">
        <div class="brand-wrap" aria-label="Brand logo">
          <div class="brand-mark">N</div>
          <div class="brand-copy">
            <span class="brand-name">NICHERZ</span>
            <small>ARCHIVE</small>
          </div>
        </div>

        <nav class="header-nav" aria-label="Main navigation">
          <a href="#">HOME</a>
          <a href="#">SHOP</a>
          <a href="#">BANDS</a>
          <a href="#">APPAREL</a>
          <a href="#">CONTACT</a>
        </nav>

        <div class="header-actions">
          <button class="cart-pill" type="button">CART (2)</button>
        </div>
      </div>
    </header>

    <main class="shop-page">
      <section class="shop-hero">
        <h1 class="shop-title">THE ARCHIVE</h1>
        <p class="shop-subtitle">Wear The Legend</p>
      </section>

      <section class="products-section">
        <nav class="shop-categories" aria-label="Product categories">
          <button class="category-btn active" data-category="all">ALL</button>

          <button class="category-btn" data-category="band-merch">
            BAND MERCH
          </button>

          <button class="category-btn" data-category="y2k">Y2K</button>

          <button class="category-btn" data-category="streetwear">
            STREETWEAR
          </button>

          <button class="category-btn" data-category="accessories">
            ACCESSORIES
          </button>

          <button class="category-btn" data-category="music">MUSIC</button>

          <button class="category-btn" data-category="collectibles">
            COLLECTIBLES
          </button>
        </nav>

        <div class="products-container" id="products-container"></div>
      </section>
    </main>

    <footer class="shop-footer">
      <div class="footer-grid">
        <div class="footer-brand">
          <span class="footer-logo">N</span>
          <div>
            <h3>NICHERZ</h3>
            <p>Curated chaos for the loudest souls.</p>
          </div>
        </div>

        <div class="footer-links">
          <h4>SHOP</h4>
          <a href="#">Band Merch</a>
          <a href="#">Streetwear</a>
          <a href="#">Accessories</a>
        </div>

        <div class="footer-links">
          <h4>INFO</h4>
          <a href="#">About</a>
          <a href="#">Shipping</a>
          <a href="#">Support</a>
        </div>

        <div class="footer-links">
          <h4>FOLLOW</h4>
          <a href="#">Instagram</a>
          <a href="#">YouTube</a>
          <a href="#">Spotify</a>
        </div>
      </div>

      <div class="footer-bottom">
        <span>© 2026 NICHERZ</span>
        <span>WEAR THE LEGEND</span>
      </div>
    </footer>

    <script src="shop.js"></script>
  </body>
</html>
