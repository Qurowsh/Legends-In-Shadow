<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | NICHERZ</title>
  <link rel="stylesheet" href="style-shop.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="toast.css" />
  <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/jpeg" href="./Images/logo.jpg" />
</head>
<body>
  <div class="smoke-background" aria-hidden="true">
    <div class="smoke smoke-one"></div>
    <div class="smoke smoke-two"></div>
    <div class="smoke smoke-three"></div>
  </div>

  <header class="shop-header">
    <div class="shop-header-inner">
      <a class="brand-wrap auth-brand" href="index.html" aria-label="NICHERZ home">
        <div class="brand-mark"><img src="./Images/logo.jpg" alt="NICHERZ logo" /></div>
        <div class="brand-copy"><span class="brand-name">NICHERZ</span><small>ARCHIVE</small></div>
      </a>
      <nav class="header-nav" aria-label="Main navigation">
        <a href="index.html">HOME</a>
        <a href="index-shop.html">SHOP</a>
        <a href="index.html#gallery">GALLERY</a>
        <a href="account.html">ACCOUNT</a>
        <a href="login.html">LOGIN</a>
      </nav>
      <div class="header-actions"><a href="cart.html" class="cart-pill">CART <span id="cartHeaderCount">(0)</span></a></div>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card auth-card-register">
      <p class="auth-kicker">NICHERZ / ARCHIVE</p>
      <h1>JOIN THE ARCHIVE</h1>
      <p class="auth-subtitle">Create your account.</p>
      <form id="registerForm" class="auth-form">
        <label for="email">EMAIL</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        <label for="password">PASSWORD</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters" />
        <label for="confirmPassword">CONFIRM PASSWORD</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Repeat your password" />
        <button id="registerBtn" type="submit" class="auth-submit">CREATE ACCOUNT</button>
      </form>
      <p class="auth-switch">ALREADY A MEMBER? <a href="login.html">ENTER HERE</a></p>
      <p id="authMessage" class="auth-message" role="status"></p>
    </section>
  </main>

  <footer class="shop-footer auth-footer">
    <div class="footer-bottom"><span>© 2026 NICHERZ</span><span>WEAR THE LEGEND</span></div>
  </footer>

  <script src="toast.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="header-auth.js"></script>
</body>
</html>
