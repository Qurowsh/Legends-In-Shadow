name: Annotate project code

on:
  push:
    branches:
      - docs/commented-code

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Annotate HTML CSS and JavaScript
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ROOT = Path('.')
          EXTENSIONS = {'.html', '.css', '.js'}

          def strip_block_comments(text, opener, closer):
              return re.sub(re.escape(opener) + r'.*?' + re.escape(closer), '', text, flags=re.S)

          def strip_js_comments(text):
              out = []
              i = 0
              state = 'code'
              quote = ''
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'code':
                      if c == '/' and n == '/':
                          i += 2
                          while i < len(text) and text[i] != '\n':
                              i += 1
                          continue
                      if c == '/' and n == '*':
                          i += 2
                          while i + 1 < len(text) and not (text[i] == '*' and text[i + 1] == '/'):
                              i += 1
                          i += 2 if i + 1 <= len(text) else 1
                          continue
                      if c in ('"', "'", '`'):
                          state = 'string'
                          quote = c
                      out.append(c)
                      i += 1
                      continue
                  if state == 'string':
                      out.append(c)
                      if c == '\\' and i + 1 < len(text):
                          out.append(text[i + 1])
                          i += 2
                          continue
                      if c == quote:
                          state = 'code'
                          quote = ''
                      i += 1
              return ''.join(out)

          def html_comment_for(line):
              s = line.strip()
              if s.startswith('<!doctype'):
                  return '<!-- نوع سند را روی HTML5 قرار می‌دهد. -->'
              if s.startswith('</'):
                  m = re.match(r'</\s*([\w-]+)', s)
                  return f'<!-- پایان بخش <{m.group(1)}> را مشخص می‌کند. -->' if m else '<!-- پایان این بخش HTML. -->'
              if '<' in s:
                  m = re.search(r'<\s*([\w-]+)', s)
                  if m:
                      tag = m.group(1)
                      return f'<!-- این خط بخش <{tag}> را شروع یا تنظیم می‌کند. -->'
              return '<!-- این خط متن قابل نمایش صفحه را قرار می‌دهد. -->'

          def annotate_html(text):
              text = strip_block_comments(text, '<!--', '-->')
              lines = text.splitlines()
              out = []
              in_tag = False
              for line in lines:
                  if not line.strip():
                      out.append(line)
                      continue
                  if in_tag:
                      out.append(line)
                      if '>' in line:
                          in_tag = False
                      continue
                  out.append(html_comment_for(line))
                  out.append(line)
                  if '<' in line and '>' not in line and not line.strip().startswith('<!'):
                      in_tag = True
              return '\n'.join(out).rstrip() + '\n'

          def css_comment_for(line):
              s = line.strip()
              if s.startswith('@media'):
                  return '<!--PLACEHOLDER-->'
              if s.startswith('@keyframes'):
                  return '<!--PLACEHOLDER-->'
              if s.startswith('@'):
                  return '<!--PLACEHOLDER-->'
              if s.endswith('{'):
                  selector = s[:-1].strip()
                  return f'/* این بخش ظاهر {selector} را تنظیم می‌کند. */'
              m = re.match(r'([\w-]+)\s*:', s)
              if m:
                  return f'/* این خط ویژگی {m.group(1)} را تنظیم می‌کند. */'
              return '/* این خط بخشی از ساختار همین بخش CSS است. */'

          def annotate_css(text):
              text = strip_block_comments(text, '/*', '*/')
              lines = text.splitlines()
              out = []
              for line in lines:
                  if not line.strip():
                      out.append(line)
                      continue
                  comment = css_comment_for(line)
                  if comment == '<!--PLACEHOLDER-->':
                      s = line.strip()
                      if s.startswith('@media'):
                          comment = f'/* این بخش قوانین واکنش‌گرا برای {s} را مشخص می‌کند. */'
                      elif s.startswith('@keyframes'):
                          name = s.split()[1] if len(s.split()) > 1 else 'animation'
                          comment = f'/* این بخش مراحل انیمیشن {name} را تعریف می‌کند. */'
                      else:
                          comment = f'/* این خط یک قانون ویژه CSS با شروع {s.split()[0]} را مشخص می‌کند. */'
                  if line.strip() != '}':
                      out.append('  ' * max(0, len(line) - len(line.lstrip()) and 0) + comment)
                  out.append(line)
              return '\n'.join(out).rstrip() + '\n'

          def js_comment_for(line):
              s = line.strip()
              if s.startswith('function '):
                  name = s.split('function ', 1)[1].split('(', 1)[0]
                  return f'// این خط تابع {name} را تعریف می‌کند.'
              if s.startswith('const ') or s.startswith('let ') or s.startswith('var '):
                  name = s.split()[1].split('=')[0].strip()
                  return f'// این خط مقدار {name} را تعریف یا ذخیره می‌کند.'
              if s.startswith('return '):
                  return '// این خط نتیجه موردنیاز را برمی‌گرداند.'
              if s.startswith('if ' ) or s.startswith('if(') or s.startswith('if ('):
                  return '// این خط یک شرط را بررسی می‌کند.'
              if s.startswith('for ') or s.startswith('for(') or s.startswith('for ('):
                  return '// این خط روی مجموعه‌ای از داده‌ها حرکت می‌کند.'
              if s.startswith('else'):
                  return '// این بخش حالت جایگزین شرط قبلی را اجرا می‌کند.'
              if s.startswith('try'):
                  return '// این بخش اجرای کد حساس به خطا را شروع می‌کند.'
              if s.startswith('catch'):
                  return '// این بخش خطای احتمالی را مدیریت می‌کند.'
              if s.startswith('throw '):
                  return '// این خط یک خطا را اعلام می‌کند.'
              if s.startswith('document.'):
                  return '// این خط با صفحه HTML و عناصر آن کار می‌کند.'
              if 'addEventListener' in s:
                  return '// این خط یک رویداد برای واکنش به کار کاربر ثبت می‌کند.'
              if 'localStorage' in s:
                  return '// این خط با داده ذخیره‌شده در مرورگر کار می‌کند.'
              if s.startswith('window.'):
                  return '// این خط از امکانات پنجره مرورگر استفاده می‌کند.'
              if s in {'{', '}', '};', '),', ');'}:
                  return None
              return '// این خط بخشی از منطق اجرای JavaScript را انجام می‌دهد.'

          def annotate_js(text):
              text = strip_js_comments(text)
              lines = text.splitlines()
              out = []
              for line in lines:
                  if not line.strip():
                      out.append(line)
                      continue
                  comment = js_comment_for(line)
                  if comment:
                      out.append(comment)
                  out.append(line)
              return '\n'.join(out).rstrip() + '\n'

          for path in ROOT.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in EXTENSIONS:
                  continue
              if '.git' in path.parts or '.github' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if path.suffix.lower() == '.html':
                  new_text = annotate_html(text)
              elif path.suffix.lower() == '.css':
                  new_text = annotate_css(text)
              else:
                  new_text = annotate_js(text)
              path.write_text(new_text, encoding='utf-8')

          # بررسی ساده JavaScript بعد از کامنت‌گذاری.
          for path in ROOT.rglob('*.js'):
              subprocess.run(['node', '--check', str(path)], check=True)

          # بررسی تعادل آکولادهای CSS.
          for path in ROOT.rglob('*.css'):
              text = path.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'CSS brace mismatch: {path}')

          # فایل موقت این فرایند را حذف می‌کنیم تا وارد پروژه اصلی نشود.
          workflow = ROOT / '.github' / 'workflows' / 'comment-code.yml'
          workflow.unlink(missing_ok=True)
          (ROOT / '.github' / 'workflows').rmdir()
          (ROOT / '.github').rmdir()

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs: add simple Persian comments to code'], check=True)
          subprocess.run(['git', 'push'], check=True)
          PY
